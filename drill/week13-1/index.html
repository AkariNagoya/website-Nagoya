<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Week13 1問目</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-200 p-10">

  <h1 class="text-2xl font-bold mb-5">Tailwind Drill: Card Layout</h1>
  <div>
    <div class="mx-auto w-80 h-[480px] shadow-md rounded">
      <img class="w-full h-46" src="https://user0514.cdnw.net/shared/img/thumb/tomcatDSC09085_TP_V.jpg" alt="A cute kitten">
      <div class="bg-white">
        <div class="justify-center font-black">Cute Kitten</div>
        <p class="text-gray-500">This is a very cute kitten. It looks very adorable and fluffy. Everyone loves kittens!</p>
        <button class="bg-blue-500 hover:bg-blue-700 text-white justify-center rounded text-xs text-center w-17 p-1.5">Read more</button>
      </div>
    </div>
  </div>
</body>
